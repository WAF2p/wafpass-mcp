name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    name: Lint, type check & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + test deps
        run: pip install ".[dev]"

      - name: Lint
        run: ruff check wafpass_mcp tests scripts

      - name: Type check
        run: mypy wafpass_mcp tests scripts

      - name: Test
        run: pytest tests -q

  docker-smoke:
    name: Docker build smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: wafpass-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
