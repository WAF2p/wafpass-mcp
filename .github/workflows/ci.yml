name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    name: Lint, type check & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + test deps
        run: pip install ".[dev]"

      - name: Lint
        run: ruff check wafpass_mcp tests scripts

      - name: Type check
        run: mypy wafpass_mcp tests scripts

      - name: Test
        run: pytest tests -q
