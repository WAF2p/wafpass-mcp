[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wafpass-mcp"
version = "0.1.0"
description = "Model Context Protocol bridge for WAF++ (WAFpass) with OIDC pass-through auth."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyjwt>=2.9.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30.0",
    "respx>=0.22.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
wafpass-mcp = "wafpass_mcp.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wafpass_mcp*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
